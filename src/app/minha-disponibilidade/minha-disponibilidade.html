<section class="disponibilidade"><p class="sobre">ÁREA DO PRESTADOR</p><h1>Minha disponibilidade</h1><p>Informe em quais dias e horários você pode atender. Os clientes verão essas informações ao solicitar um serviço.</p>@if(erro()){<p class="erro">{{erro()}}</p>}@if(sucesso()){<p class="sucesso">{{sucesso()}}</p>}<form (ngSubmit)="salvar()"><div class="dia" *ngFor="let dia of dias"><mat-checkbox [name]="'ativo-'+dia.key" [(ngModel)]="horarios[dia.key].ativo">{{dia.nome}}</mat-checkbox><mat-form-field appearance="outline"><mat-label>Início</mat-label><input matInput type="time" [name]="'inicio-'+dia.key" [(ngModel)]="horarios[dia.key].inicio" [disabled]="!horarios[dia.key].ativo"></mat-form-field><mat-form-field appearance="outline"><mat-label>Fim</mat-label><input matInput type="time" [name]="'fim-'+dia.key" [(ngModel)]="horarios[dia.key].fim" [disabled]="!horarios[dia.key].ativo"></mat-form-field></div><button mat-flat-button color="primary" type="submit" [disabled]="carregando()">{{carregando()?'Salvando...':'Salvar disponibilidade'}}</button></form></section>
